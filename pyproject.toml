[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-refactor-qwen"
version = "0.1.0"
description = "Reproducible instruction-conditioned Java refactoring experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
inference = ["vllm", "transformers", "huggingface-hub"]

[project.scripts]
swe-refactor = "swe_refactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
