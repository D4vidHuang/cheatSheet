name: core checks
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - name: Reject accidentally tracked runtime data
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in paths if (p.startswith('data/') and p != 'data/README.md') or p.startswith(('runs/', 'models/', '.venv/'))]
          if bad:
              raise SystemExit('Unexpected runtime files in Git: ' + ', '.join(bad))
          PY
